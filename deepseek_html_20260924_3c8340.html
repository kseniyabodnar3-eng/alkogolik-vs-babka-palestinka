<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Алкоголик против Бабки Палестинки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="900" height="400"></canvas>
        <div id="ui">
            <div id="score">Счёт: 0</div>
            <div id="best">Рекорд: 0</div>
        </div>
        <div id="start-screen" class="overlay">
            <h1>Алкоголик против Бабки Палестинки</h1>
            <p>Бабуся убегает от дедуси с дубинкой!</p>
            <p>Жми <b>ПРОБЕЛ</b> или <b>↑</b>, чтобы перепрыгнуть стог сена</p>
            <button id="start-btn">Начать игру</button>
        </div>
        <div id="game-over" class="overlay hidden">
            <h1>Дедуся догнал бабусю!</h1>
            <p>Твой счёт: <span id="final-score">0</span></p>
            <button id="restart-btn">Ещё разок</button>
        </div>
        <button id="music-btn" title="Включить/выключить музыку">🔇</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
